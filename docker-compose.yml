services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: baymax
      POSTGRES_USER: baymax
      POSTGRES_PASSWORD: change-me-local-only
    ports:
      - "5432:5432"
    volumes:
      - baymax-postgres:/var/lib/postgresql/data
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://baymax:change-me-local-only@db:5432/baymax
      SESSION_SECRET: change-me-local-only
      FRONTEND_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
    depends_on:
      - db
    ports:
      - "8000:8000"
volumes:
  baymax-postgres:
